name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    env:
      MCP_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mcp_review_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mcp_review_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (warnings fail the build)
        run: pnpm lint

      - name: Typecheck (all packages via project references)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  upstream-fixtures:
    # The cross-repo check no test inside this repository can perform.
    # packages/mcp-types/fixtures/ holds Bastion's copy of the result contract
    # apatureai/verdict produces; an in-process test can only prove that copy has
    # not been edited locally, which is why the one that claimed more was renamed.
    # This job puts verdict on disk and compares the bytes, which is the only
    # place the comparison is possible.
    name: fixtures match apatureai/verdict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout verdict
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apatureai/verdict
          path: .upstream/verdict

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Compare fixtures byte for byte
        run: node scripts/verify-upstream-fixtures.mjs .upstream/verdict
